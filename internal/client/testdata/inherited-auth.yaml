apiVersion: v1
kind: Config
current-context: dev
contexts:
- name: dev
  context: {cluster: dev, user: dev}
clusters:
- name: dev
  cluster: {server: 'https://dev.example'}
users:
- name: dev
  user:
    tokenFile: /missing/token
    exec:
      command: /missing/helper
      apiVersion: client.authentication.k8s.io/v1
      interactiveMode: Never
